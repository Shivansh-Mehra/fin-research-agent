version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fin_agent_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: fin_research
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    
  api:
    build: .
    container_name: fin_agent_api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://admin:adminpassword@db:5432/fin_research
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GROQ_MODEL=openai/gpt-oss-20b
    depends_on:
      - db
      
  ui:
    build: .
    container_name: fin_agent_ui
    command: streamlit run ui.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata: